<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ร้านค้า</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#fafaf8;--tx:#161616;--mu:#7b7b76;--bd:#e6e6e1;--ac:#0f766e;--ac2:#fff;--ok:#15803d;--er:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Noto Sans Thai",system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:0 18px 130px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 0;border-bottom:1px solid var(--bd);margin-bottom:20px}
.lg{font-weight:600;font-size:18px;display:flex;align-items:center;gap:8px}.lg img{height:28px;max-width:110px;object-fit:contain}
.bal{font-weight:600;color:var(--ac)}.mu{color:var(--mu);font-size:14px}.r{display:flex;justify-content:space-between;align-items:center;gap:10px}
.c{border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}.c h3{margin:0 0 6px;font-size:16px;font-weight:600}
input,textarea,select{width:100%;padding:12px 14px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit;outline:0}
select{background:var(--bg)}input[type=color]{height:44px;padding:4px}input:focus,textarea:focus{border-color:var(--ac)}
.b{padding:12px 20px;border:1px solid var(--ac);border-radius:10px;background:var(--ac);color:var(--ac2);font:inherit;font-weight:500;cursor:pointer}
.b.s{background:transparent;color:var(--tx);border-color:var(--bd)}.b.d{background:var(--er);border-color:var(--er);color:#fff}.b.sm{padding:7px 13px;font-size:13px}.b:disabled{opacity:.45}.b.f{width:100%;margin-top:8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px}
.p{cursor:pointer}.p .im{aspect-ratio:1;background:var(--bd);border-radius:10px;overflow:hidden}.p img{width:100%;height:100%;object-fit:cover;display:block}
.p b{display:block;font-weight:500;margin-top:8px;line-height:1.35}
.pr{display:block;font-size:20px;font-weight:600}.pr small{font-size:13px;font-weight:400;color:var(--mu)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--bd)}.rw:last-child{border:0}
.ac{display:flex;gap:6px;flex-wrap:wrap}
#nv{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--bd);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:20}
#nv button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:13px;padding:10px 0;cursor:pointer}#nv button.on{color:var(--ac);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--bg);border:1px solid var(--bd);border-radius:16px;max-width:400px;width:100%;max-height:90vh;overflow:auto;padding:20px;animation:pop .25s ease}
.big{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;margin-bottom:12px}
.msg{padding:12px;border-radius:10px;background:var(--bd);white-space:pre-wrap;word-break:break-word;margin:10px 0}
.atb{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}.atb button{flex:1;white-space:nowrap}
#tw{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:min(92vw,360px);z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.ts{background:var(--bg);border:1px solid var(--ok);padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);animation:pop .25s ease}.ts.er{border-color:var(--er)}
.chip{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--bd)}.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.er{color:var(--er);border-color:var(--er)}
.nb{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:16px;text-align:center;font-size:14px}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="tw"></div><div class="w"><div id="app" class="mu">กำลังโหลด...</div></div><div id="mo"></div>
<script>
/* ===== ตั้งค่า ===== */
const CFG={apiKey:"AIzaSyASvuyhGLcblkYWRuHhXOuIi2Gj6zYtzJU",authDomain:"chingame-ae1ce.firebaseapp.com",projectId:"chingame-ae1ce",appId:"1:691058862335:web:4f4597ec07c7a7245bc4ca"};
const MAIN_HOST="deltastore.rexzy.xyz"; /* โดเมนเว็บหลัก */
const SUBDOMAIN=false; /* true = ลิงก์ร้านเป็น ชื่อร้าน.โดเมน (ต้องตั้ง wildcard DNS) */

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rs=()=>Math.random().toString(36).substring(2,10);
const sha=async(p,s)=>Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p+s)))).map(x=>x.toString(16).padStart(2,"0")).join("");
const fd=t=>new Date(t).toLocaleString("th-TH");

const SHOP=(()=>{
const q=new URLSearchParams(location.search).get("shop");
if(q&&/^[a-z0-9-]{2,30}$/.test(q))return q;
const h=location.hostname;
if(h.endsWith("."+MAIN_HOST)){const s=h.slice(0,-MAIN_HOST.length-1).split(".").pop();if(/^[a-z0-9-]{2,30}$/.test(s)&&s!=="www")return s}
return"main";
})();
const MAIN=SHOP==="main",B=MAIN?"":"shops/"+SHOP+"/";
const LS={get:k=>{try{return localStorage.getItem(k+"_"+SHOP)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k+"_"+SHOP,v)}catch(e){}}};
const OK=!!(window.firebase&&CFG.projectId);
if(OK)firebase.initializeApp(CFG);
const R=OK?firebase.firestore():null,D=p=>R.doc(B+p),C=c=>R.collection(B+c);

let plans=[],rentals=[],shops=[],me=null,site={},products=[],wal={credits:0,orders:[]},tops=[],keys=[],tab="",asub="prod",busy=false,qs="";
try{me=JSON.parse(LS.get("sess")||"null")}catch(e){}
const isAdm=()=>me&&me.role==="admin";

function say(m,ok){const t=document.createElement("div");t.className="ts"+(ok?"":" er");t.textContent=m;$("#tw").appendChild(t);setTimeout(()=>t.remove(),3200)}
const ERR=e=>e&&(e.code=="permission-denied"?"ไม่มีสิทธิ์เขียนฐานข้อมูล (ตรวจ Firestore Rules)":e.message||e.code)||"ผิดพลาด";
const closeM=()=>$("#mo").innerHTML="";
const modal=h=>$("#mo").innerHTML=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="md">${h}</div></div>`;
function pic(file,max){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL(max<=300?"image/png":"image/jpeg",.75))};i.onerror=()=>no(Error("เปิดรูปไม่ได้"));i.src=fr.result};fr.onerror=()=>no(Error("อ่านไฟล์ไม่ได้"));fr.readAsDataURL(file)})}

/* ===== ธีม (ร้านปรับแต่งได้) ===== */
const FONTS=["Noto Sans Thai","Prompt","Kanit","Sarabun"];
const hx=(c,d)=>/^#[0-9a-f]{6}$/i.test(c||"")?c:d;
const lum=h=>{const n=parseInt(h.slice(1),16),f=x=>{x/=255;return x<=.04?x/12.92:((x+.055)/1.055)**2.4};return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)};
const vr=(bg,tx,ac)=>`--bg:${bg};--tx:${tx};--ac:${ac};--ac2:${lum(ac)>.45?"#111":"#fff"};--mu:color-mix(in srgb,${tx} 50%,${bg});--bd:color-mix(in srgb,${tx} 12%,${bg})`;
function theme(){
const ac=hx(site.ac,"#0f766e"),r=site.radius??10,f=FONTS.includes(site.font)?site.font:"Noto Sans Thai";
let css=`:root{${vr(hx(site.bgL,"#fafaf8"),hx(site.txL,"#161616"),ac)}}@media(prefers-color-scheme:dark){:root{${vr(hx(site.bgD,"#121212"),hx(site.txD,"#f0f0ec"),hx(site.acD,ac))}}}`;
css+=`body{font-family:"${f}",system-ui,sans-serif}.c,.md{border-radius:${+r+6}px}.b,input,textarea,select,.p .im{border-radius:${+r}px}.g{grid-template-columns:repeat(auto-fill,minmax(${+site.tile||150}px,1fr))}`;
let el=$("#thm");if(!el){el=document.createElement("style");el.id="thm";document.head.appendChild(el)}
el.textContent=css;
let l=$("#fl");if(!l){l=document.createElement("link");l.id="fl";l.rel="stylesheet";document.head.appendChild(l)}
l.href="https://fonts.googleapis.com/css2?family="+f.replace(/ /g,"+")+":wght@400;500;600&display=swap";
document.title=site.name||(MAIN?"เช่าเว็บร้านค้า":"ร้านค้า");
}

/* ===== โหลดข้อมูล ===== */
async function load(){
const g=async q=>(await q.get().catch(()=>({docs:[]}))).docs.map(x=>({id:x.id,...x.data()}));
const s=await D("settings/site").get().catch(()=>({exists:false}));
site=s.exists?s.data():{};theme();
if(MAIN){
plans=(await g(C("plans"))).sort((a,b)=>a.price-b.price);
if(me)rentals=(await g(isAdm()?C("rentals"):C("rentals").where("u","==",me.u))).sort((a,b)=>b.at-a.at);
if(isAdm())shops=await g(R.collection("shops_meta"));
}else{
products=await g(C("products"));
if(me&&!isAdm()){const w=await D("wallets/"+me.u).get().catch(()=>({exists:false}));wal=w.exists?w.data():{credits:0,orders:[]};tops=(await g(C("topups").where("u","==",me.u))).sort((a,b)=>b.at-a.at)}
if(isAdm()){tops=(await g(C("topups"))).sort((a,b)=>b.at-a.at);keys=await g(C("keys"))}
}
}

/* ===== เข้าสู่ระบบ (ลูกค้า + แอดมินใช้ฟอร์มเดียวกัน) ===== */
function authUI(up){
modal(`<div class="atb"><button class="b sm ${up?"s":""}" onclick="authUI(0)">เข้าสู่ระบบ</button><button class="b sm ${up?"":"s"}" onclick="authUI(1)">สมัครสมาชิก</button></div><input id="au" placeholder="ชื่อผู้ใช้" autocapitalize="none"><input id="ap" type="password" placeholder="รหัสผ่าน (อย่างน้อย 4 ตัว)"><button class="b f" onclick="doAuth(${up})">${up?"สมัครสมาชิก":"เข้าสู่ระบบ"}</button>`);
}
async function doAuth(up){
const u=$("#au").value.trim(),pw=$("#ap").value,adm=u.toLowerCase()==="admin";
if(!/^[A-Za-z0-9_.-]{4,30}$/.test(u))return say("ชื่อผู้ใช้ 4-30 ตัว (A-Z a-z 0-9 _ . -)");
if(pw.length<4)return say("รหัสผ่านอย่างน้อย 4 ตัว");
if(adm&&up)return say("ชื่อนี้ใช้ไม่ได้");
try{
if(adm){
const s=await D("admins/admin").get();
if(!s.exists)return say("ยังไม่ได้ตั้งรหัสผู้ดูแล");
const d=s.data();if(d.hash!==await sha(pw,d.salt))return say("รหัสผ่านไม่ถูกต้อง");
me={u:"admin",role:"admin"};tab="adm";
}else{
const r=D("accounts/"+u),s=await r.get();
if(up){
if(s.exists)return say("ชื่อนี้ถูกใช้แล้ว");
const salt=rs();
await r.set({hash:await sha(pw,salt),salt,at:Date.now()});
if(!MAIN)await D("wallets/"+u).set({credits:+site.welcome||0,orders:[]});
}else{
if(!s.exists)return say("ไม่พบชื่อผู้ใช้");
const d=s.data();
if(d.hash!==await sha(pw,d.salt))return say("รหัสผ่านไม่ถูกต้อง");
if(d.banned)return say("บัญชีนี้ถูกระงับ");
}
me={u,role:"user"};
}
LS.set("sess",JSON.stringify(me));closeM();await load();render();say(up?"สมัครสำเร็จ":"เข้าสู่ระบบสำเร็จ",1);
}catch(e){say(ERR(e))}
}
function logout(){me=null;wal={credits:0,orders:[]};LS.set("sess","");tab="";render()}

/* ===== หน้าหลัก ===== */
function render(){
const T=[];
if(MAIN){T.push(["plans","แพ็กเกจเช่า"]);if(me&&!isAdm())T.push(["mine","การเช่าของฉัน"])}
else{T.push(["shop","สินค้า"]);if(me&&!isAdm())T.push(["top","เติมเงิน"],["his","ประวัติ"])}
if(isAdm())T.push(["adm","แอดมิน"]);
if(!T.some(t=>t[0]===tab))tab=T[0][0];
const nm=site.name||(MAIN?"เช่าเว็บร้านค้า":"ร้านค้า");
let h=`<header><span class="lg">${site.logo?`<img src="${esc(site.logo)}">`:""}${esc(nm)}</span><span class="r" style="gap:10px">${me&&!isAdm()&&!MAIN?`<span class="bal">${wal.credits||0} บาท</span>`:""}${me?`<button class="b s sm" onclick="logout()">ออก</button>`:`<button class="b sm" onclick="authUI(0)">เข้าสู่ระบบ</button>`}</span></header>`;
if(site.notice)h+=`<div class="nb">${esc(site.notice)}</div>`;
if(tab=="shop")h+=shopUI();
if(tab=="top")h+=topUI();
if(tab=="his")h+=`<div class="c"><h3>ประวัติสั่งซื้อ</h3>${(wal.orders||[]).slice().reverse().map(o=>`<div class="rw"><div><b>${esc(o.name)}</b><div class="mu">${fd(o.at)}</div></div><b>${o.price} บาท</b></div>`).join("")||'<span class="mu">ยังไม่มี</span>'}</div>`;
if(tab=="plans")h+=plansUI();
if(tab=="mine")h+=mineUI();
if(tab=="adm")h+=MAIN?platUI():adminUI();
$("#app").innerHTML=h;
let n=$("#nv");
if(T.length>1){if(!n){n=document.createElement("div");n.id="nv";document.body.appendChild(n)}n.innerHTML=T.map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="goT('${k}')">${l}</button>`).join("")}else if(n)n.remove();
}
const goT=k=>{tab=k;render();scrollTo(0,0)};

/* ===== ร้านค้า (ฝั่งลูกค้า) ===== */
const oos=p=>p.stock!=null&&p.stock!==""&&+p.stock<=0;
function shopUI(){
const L=products.filter(p=>!p.hide&&(!qs||(p.name||"").toLowerCase().includes(qs.toLowerCase())));
return (site.banner?`<img src="${esc(site.banner)}" style="width:100%;border-radius:14px;margin-bottom:16px;display:block">`:"")+`<input placeholder="ค้นหาสินค้า" value="${esc(qs)}" oninput="qs=this.value;document.getElementById('gr').innerHTML=grid()"><div id="gr">${grid()}</div>`;
}
function grid(){
const L=products.filter(p=>!p.hide&&(!qs||(p.name||"").toLowerCase().includes(qs.toLowerCase())));
return L.length?`<div class="g">${L.map(p=>`<div class="p" onclick="detail('${p.id}')"><div class="im">${p.img?`<img src="${esc(p.img)}" loading="lazy">`:""}</div><b>${esc(p.name)}</b><span class="pr">${p.price} <small>บาท</small></span>${oos(p)?'<span class="mu">สินค้าหมด</span>':""}</div>`).join("")}</div>`:'<div class="c mu">ไม่พบสินค้า</div>';
}
function detail(id){
if(!me){authUI(0);return say("เข้าสู่ระบบก่อนสั่งซื้อ")}
if(isAdm())return say("ผู้ดูแลสั่งซื้อไม่ได้ ใช้บัญชีลูกค้าแทน");
const p=products.find(x=>x.id==id);if(!p)return;
modal(`${p.img?`<img class="big" src="${esc(p.img)}">`:""}<h3 style="margin:0">${esc(p.name)}</h3><p class="mu" style="white-space:pre-wrap">${esc(p.desc||"")}</p>${p.stock!=null&&p.stock!==""&&!oos(p)?`<p class="mu">คงเหลือ ${p.stock} ชิ้น</p>`:""}<div class="r"><span style="font-size:26px;font-weight:600">${p.price} <small class="mu">บาท</small></span>${oos(p)?'<button class="b" disabled>สินค้าหมด</button>':`<button class="b" id="bb" onclick="buy('${p.id}')">สั่งซื้อ</button>`}</div>`);
}
async function buy(id){
if(busy)return;busy=true;const b=$("#bb");if(b)b.disabled=true;
try{
let msg="";
await R.runTransaction(async t=>{
const pr=D("products/"+id),wr=D("wallets/"+me.u);
const [ps,ws]=await Promise.all([t.get(pr),t.get(wr)]);
if(!ps.exists)throw Error("ไม่พบสินค้า");
const p=ps.data(),d=ws.exists?ws.data():{credits:0,orders:[]};
if(p.stock!=null&&p.stock!==""&&+p.stock<=0)throw Error("สินค้าหมด");
if((d.credits||0)<p.price)throw Error("ยอดเงินไม่พอ กรุณาเติมเงิน");
t.set(wr,{...d,credits:d.credits-p.price,orders:[...(d.orders||[]),{name:p.name,price:p.price,at:Date.now()}]});
if(p.stock!=null&&p.stock!=="")t.update(pr,{stock:+p.stock-1});
msg=p.message||"ขอบคุณที่ใช้บริการ";
});
await load();render();
modal(`<h3 style="margin:0">สั่งซื้อสำเร็จ</h3><div class="msg" style="user-select:all">${esc(msg)}</div><button class="b f" onclick="closeM()">ปิด</button>`);
}catch(e){if(b)b.disabled=false;say(ERR(e))}
finally{busy=false}
}

/* ===== เติมเงิน: แนบสลิป (แอดมินอนุมัติ) + คีย์ ===== */
function topUI(){
return `<div class="c"><h3>เติมเงินด้วยสลิป</h3>${site.qr||site.pay?`${site.qr?`<img src="${esc(site.qr)}" style="max-width:200px;border-radius:10px;display:block;margin-bottom:10px">`:""}<div class="mu" style="white-space:pre-wrap">${esc(site.pay||"")}</div><input id="ta" type="number" min="1" placeholder="จำนวนเงินที่โอน (บาท)"><input id="ts" type="file" accept="image/*"><button class="b f" id="tb" onclick="sendSlip()">แจ้งโอน</button>`:'<div class="mu">ร้านนี้ยังไม่เปิดเติมเงินด้วยสลิป</div>'}</div><div class="c"><h3>ใส่คีย์เติมเงิน</h3><input id="k" placeholder="XXXX-XXXX-XXXX" autocapitalize="characters"><button class="b f" onclick="redeem()">ยืนยัน</button></div>${tops.length?`<div class="c"><h3>ประวัติแจ้งโอน</h3>${tops.map(t=>`<div class="rw"><span>${t.amount} บาท<div class="mu">${fd(t.at)}</div></span>${stChip(t.status)}</div>`).join("")}</div>`:""}`;
}
const SN={pending:["รอตรวจสอบ",""],approved:["อนุมัติแล้ว","ok"],rejected:["ไม่อนุมัติ","er"],done:["เปิดร้านแล้ว","ok"]};
const stChip=s=>`<span class="chip ${SN[s][1]}">${SN[s][0]}</span>`;
async function sendSlip(){
const a=+($("#ta").value||0),f=$("#ts").files[0];
if(!(a>0))return say("กรอกจำนวนเงิน");if(!f)return say("แนบสลิป");
if(busy)return;busy=true;const b=$("#tb");b.disabled=true;
try{await D("topups/"+rs()).set({u:me.u,amount:a,img:await pic(f,600),at:Date.now(),status:"pending"});await load();render();say("แจ้งโอนแล้ว รอแอดมินตรวจสอบ",1)}
catch(e){b.disabled=false;say(ERR(e))}finally{busy=false}
}
async function redeem(){
const c=$("#k").value.trim().toUpperCase();if(!c)return say("กรอกคีย์");
if(busy)return;busy=true;
try{
let val=0;
await R.runTransaction(async t=>{
const kr=D("keys/"+c),wr=D("wallets/"+me.u);
const [k,w]=await Promise.all([t.get(kr),t.get(wr)]);

/* ตั้งรหัสแอดมินเว็บหลักครั้งแรก */
function setupUI(){
modal(`<h3 style="margin:0 0 6px">ตั้งรหัสผู้ดูแล</h3><div class="mu">ครั้งแรกที่เปิดเว็บ ตั้งรหัสผ่านสำหรับชื่อ admin แล้วเข้าสู่ระบบด้วยชื่อ admin ได้เลย</div><input id="sp1" type="password" placeholder="รหัสผ่าน (อย่างน้อย 8 ตัว)"><button class="b f" onclick="doSetup()">ตั้งรหัส</button>`);
}
async function doSetup(){
const p=$("#sp1").value;if(p.length<8)return say("อย่างน้อย 8 ตัว");
try{const salt=rs();await R.doc("admins/admin").set({hash:await sha(p,salt),salt});closeM();say("ตั้งรหัสแล้ว เข้าสู่ระบบด้วยชื่อ admin ได้เลย",1);authUI(0)}catch(e){say(ERR(e))}
}

/* ===== เริ่มทำงาน ===== */
(async()=>{
if(!OK){$("#app").innerHTML='<div class="c"><h3>ยังเชื่อมฐานข้อมูลไม่ได้</h3><div class="mu">โหลด Firebase ไม่สำเร็จ ตรวจอินเทอร์เน็ตหรือค่า CFG</div></div>';return}
try{
if(!MAIN){
const m=await R.doc("shops_meta/"+SHOP).get(),d=m.exists?m.data():null;
if(!d||d.off||(d.exp&&d.exp<Date.now())){
$("#app").innerHTML='<div class="c" style="text-align:center;margin-top:60px"><h3>ร้านนี้ยังไม่เปิดใช้งานหรือหมดอายุ</h3><div class="mu">กรุณาติดต่อเจ้าของร้าน</div></div>';return;
}
}
if(me){
if(isAdm()){if(!(await D("admins/admin").get()).exists)me=null}
else{const a=await D("accounts/"+me.u).get();if(!a.exists||a.data().banned)me=null}
}
await load();render();
if(MAIN&&!(await R.doc("admins/admin").get()).exists)setupUI();
}catch(e){$("#app").innerHTML='<div class="c" style="color:var(--er)">โหลดไม่สำเร็จ: '+esc(ERR(e))+'<div class="mu">ตรวจค่า CFG ของ Firebase และ Firestore Rules</div></div>'}
})();
</script></body></html>
