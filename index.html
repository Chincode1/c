function cut(c,tol){

function authUI(up){

async function doAuth(up){
const u=$("#au").value.trim(),pw=$("#ap").value,adm=u.toLowerCase()==="admin";
if(!/^[A-Za-z0-9_.-]{4,30}$/.test(u))return say("ชื่อผู้ใช้ 4-30 ตัว (A-Z a-z 0-9 _ . -)");
if(pw.length<4)return say("รหัสผ่านอย่างน้อย 4 ตัว");
if(adm&&up)return say("ชื่อนี้ใช้ไม่ได้");
try{
if(adm){
const s=await D("admins/admin").get();
if(!s.exists)return say("ยังไม่ได้ตั้งรหัสผู้ดูแล");
const d=s.data();if(d.hash!==await sha(pw,d.salt))return say("รหัสผ่านไม่ถูกต้อง");
me={u:"admin",role:"admin"};tab="";
}else{
const r=D("accounts/"+u),s=await r.get();
if(up){
if(s.exists)return say("ชื่อนี้ถูกใช้แล้ว");
const salt=rs();
await r.set({hash:await sha(pw,salt),salt,at:Date.now()});
if(!MAIN)await D("wallets/"+u).set({credits:+site.welcome||0,orders:[]});
}else{
if(!s.exists)return say("ไม่พบชื่อผู้ใช้");
const d=s.data();
if(d.hash!==await sha(pw,d.salt))return say("รหัสผ่านไม่ถูกต้อง");
if(d.banned)return say("บัญชีนี้ถูกระงับ");
}
me={u,role:"user"};
}
LS.set("sess",JSON.stringify(me));closeM();await load();liveWallet();render();say(up?"สมัครสำเร็จ":"เข้าสู่ระบบสำเร็จ",1);
}catch(e){say(ERR(e))}
}

(()=>{

/* วิดีโอพื้นหลังที่อัปโหลดเอง (แบ่งเก็บเป็นชิ้นใน Firestore) */
async function vid(){
if(!site.bgvN){$("#bgv2")?.remove();return}
document.body.classList.add("hv");
if(window.__vk===site.bgvAt&&$("#bgv2"))return;window.__vk=site.bgvAt;
try{

const bl=await(await fetch(s)).blob();$("#bgv2")?.remove();
const v=document.createElement("video");v.id="bgv2";v.src=URL.createObjectURL(bl);v.autoplay=v.loop=v.muted=v.playsInline=true;
document.body.prepend(v);v.play().catch(()=>{});
}catch(e){window.__vk=null}
}
window.cuVid=async el=>{
const f=el.files[0];if(!f)return;
if(f.size>2.6e6)return say("วิดีโอใหญ่เกิน 2.5MB ตัดให้สั้น/บีบอัดก่อน หรือใช้ช่องลิงก์แทน");
run(async()=>{
const u=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
const n=Math.ceil(u.length/7e5);
for(let i=0;i<n;i++)await D("media/bgv_"+i).set({d:u.slice(i*7e5,(i+1)*7e5)});
for(let i=n;i<(site.bgvN||0);i++)await D("media/bgv_"+i).delete();

},"อัปโหลดวิดีโอแล้ว");
};

+blk("วิดีโอพื้นหลัง (เล่นวนซ้ำ)","อัปโหลดไฟล์ได้ไม่เกิน 2.5MB หรือวางลิงก์ .mp4",`<div class="mu">${site.bgvN?"มีวิดีโอที่อัปโหลดอยู่แล้ว":site.bgv?"ใช้ลิงก์อยู่":"ยังไม่มีวิดีโอ"}</div><input type="file" accept="video/*" onchange="cuVid(this)"><input placeholder="หรือลิงก์ https://....mp4" value="${esc(site.bgv||"")}" onchange="cuSet('bgv',this.value.trim())">${site.bgvN||site.bgv?`<button class="b d sm" onclick="cuVidDel()">ลบวิดีโอ</button>`:""}`)
+blk("ข้อความ + รูปประกาศ","ข้อความวิ่งด้านบน และรูปเต็มความกว้างใต้หัวเว็บ",`<input placeholder="ข้อความประกาศวิ่ง" value="${esc(site.notice||"")}" onchange="cuSet('notice',this.value.trim())">${img("noticeImg",900)}`)
+blk("โฆษณา (ป๊อปอัปตอนเข้าเว็บ)","รูปจะแสดงเต็ม 100% ของกล่อง",`<textarea placeholder="ข้อความโฆษณา (ไม่ใส่ก็ได้)" onchange="cuSet('pop',this.value.trim())">${esc(site.pop||"")}</textarea>${img("popImg",900)}`)

<script>
(()=>{
window.__rmx=false;
const SKIP=["ts","rsl","cf","pf"];
const has=e=>e&&e.matches&&e.matches("label.cl")&&e.querySelector('input[type=checkbox][id*="rm"]');
function scan(){
document.querySelectorAll('input[type=file][accept="image/*"]').forEach(i=>{
if(i.dataset.rmx||i.hidden||SKIP.includes(i.id))return;
i.dataset.rmx=1;
if(has(i.nextElementSibling)||has(i.previousElementSibling))return;
const l=document.createElement("label");l.className="cl rmw";
l.innerHTML='<span>ลบพื้นหลังรูปนี้ (ติ๊กก่อนเลือกรูป)</span><input type="checkbox" class="rmx">';
const c=l.querySelector("input");c.checked=window.__rmx;c.onchange=()=>{window.__rmx=c.checked};
i.after(l);
});
}
new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});scan();
const _p=pic;
pic=(f,m,r)=>{
const inp=[...document.querySelectorAll("input[type=file]")].find(x=>x.files&&x.files[0]===f);
const on=r||!!(inp&&inp.nextElementSibling?.querySelector?.(".rmx")?.checked);
return _p(f,on?Math.min(m,600):m,on?true:r);
};
})();
</script>

<!-- ===== ADDON 7: วิดีโอป้ายประกาศหน้าหลัก + ลบพื้นหลัง ===== -->
<script>
(()=>{
const FV=()=>firebase.firestore.FieldValue;
const ov=on=>{if(on){if(!$("#ld")){const d=document.createElement("div");d.id="ld";d.innerHTML='<div class="spn"></div>';document.body.appendChild(d)}}else $("#ld")?.remove()};
let cache={k:null,u:null},pend=null;
async function src(){
if(site.nbN){
const k=site.nbAt;if(cache.k===k)return cache.u;
if(!pend||pend.k!==k)pend={k,p:(async()=>{let s="";for(let i=0;i<site.nbN;i++)s+=(await D("media/nb_"+i).get()).data().d;const b=await(await fetch(s)).blob();cache={k,u:URL.createObjectURL(b)};return cache.u})()};
return pend.p;
}
return /^https:\/\//.test(site.nbv||"")?site.nbv:null;
}
function build(box,u){
const m=site.nbMode||"none",v=document.createElement("video");
v.src=u;v.autoplay=v.loop=v.muted=v.playsInline=true;v.setAttribute("muted","");
const plain=()=>{v.style.cssText="width:100%;height:auto;display:block;"+(m=="black"?"mix-blend-mode:screen":m=="white"?"mix-blend-mode:multiply":"");if(!box.contains(v))box.appendChild(v)};
if(m!="auto"){plain();v.play().catch(()=>{});return}
v.style.cssText="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none";box.style.position="relative";
const cv=document.createElement("canvas");cv.style.cssText="width:100%;height:auto;display:block";
box.append(v,cv);v.play().catch(()=>{});
const x=cv.getContext("2d",{willReadFrequently:true}),tol=+site.nbTol||90;let ref=null;
const loop=()=>{
if(!document.body.contains(cv))return;
if(v.videoWidth&&!v.paused){
const w=Math.min(v.videoWidth,480),h=Math.round(w*v.videoHeight/v.videoWidth);
if(cv.width!==w){cv.width=w;cv.height=h}
x.drawImage(v,0,0,w,h);
try{
const im=x.getImageData(0,0,w,h),d=im.data;
if(!ref)ref=[d[0],d[1],d[2]];
for(let i=0;i<d.length;i+=4){
const df=Math.abs(d[i]-ref[0])+Math.abs(d[i+1]-ref[1])+Math.abs(d[i+2]-ref[2]);
if(df<tol)d[i+3]=0;else if(df<tol*1.5)d[i+3]=(df-tol)/(tol*.5)*255;
}
x.putImageData(im,0,0);
}catch(e){cv.remove();plain();return}
}
requestAnimationFrame(loop);
};
loop();
}
window.nbUp=async el=>{
const f=el.files[0];if(!f)return;
if(f.size>2.6e6)return say("วิดีโอใหญ่เกิน 2.5MB ตัดให้สั้น/บีบอัดก่อน หรือใช้ลิงก์แทน");
ov(1);try{
const u=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
const n=Math.ceil(u.length/7e5);
for(let i=0;i<n;i++)await D("media/nb_"+i).set({d:u.slice(i*7e5,(i+1)*7e5)});
for(let i=n;i<(site.nbN||0);i++)await D("media/nb_"+i).delete();
await D("settings/site").set({nbN:n,nbAt:Date.now()},{merge:true});
await load();render();say("อัปโหลดวิดีโอป้ายประกาศแล้ว",1);
}catch(e){say(ERR(e))}finally{ov(0)}
};
window.nbDel=async()=>{
ov(1);try{
for(let i=0;i<(site.nbN||0);i++)await D("media/nb_"+i).delete();
await D("settings/site").update({nbN:FV().delete(),nbAt:FV().delete(),nbv:FV().delete()});
await load();render();say("ลบวิดีโอแล้ว",1);
}catch(e){say(ERR(e))}finally{ov(0)}
};
const opt=(v,l)=>`<option value="${v}" ${(site.nbMode||"none")==v?"selected":""}>${l}</option>`;
const card=()=>`<div class="c"><h3>วิดีโอป้ายประกาศหน้าหลัก</h3><div class="mu" style="margin-bottom:8px">แสดงใต้หัวเว็บ อัปโหลดไม่เกิน 2.5MB หรือวางลิงก์ .mp4 (ถ้าใช้ "ลบสีตามมุมภาพ" กับลิงก์ ลิงก์ต้องรองรับ CORS ไม่งั้นให้อัปโหลดไฟล์แทน)</div><div class="mu">${site.nbN?"มีวิดีโอที่อัปโหลดอยู่":site.nbv?"ใช้ลิงก์อยู่":"ยังไม่มีวิดีโอ"}</div><input type="file" accept="video/*" onchange="nbUp(this)"><input placeholder="หรือลิงก์ https://....mp4" value="${esc(site.nbv||"")}" onchange="cuSet('nbv',this.value.trim())"><label class="mu">ลบพื้นหลังวิดีโอ</label><select onchange="cuSet('nbMode',this.value)">${opt("none","ไม่ลบ")}${opt("black","ลบพื้นดำ")}${opt("white","ลบพื้นขาว")}${opt("auto","ลบสีตามมุมภาพ (พื้นสีเรียบ)")}</select>${site.nbMode=="auto"?`<label class="mu">ความไวการลบสี: <b id="nbtv">${+site.nbTol||90}</b></label><input type="range" min="20" max="220" step="10" value="${+site.nbTol||90}" oninput="document.getElementById('nbtv').textContent=this.value" onchange="cuSet('nbTol',+this.value)">`:""}${site.nbN||site.nbv?`<button class="b d sm" onclick="nbDel()">ลบวิดีโอ</button>`:""}</div>`;
const _r=render;render=function(){
_r();
const h=$("#app header");
if(h&&tab!="acct"&&(site.nbN||site.nbv)){
const box=document.createElement("div");box.id="nbv";box.style.cssText="width:100%;margin-bottom:14px";h.after(box);
src().then(u=>{if(u&&document.body.contains(box))build(box,u)}).catch(()=>{});
}
if(tab=="a_cust"&&isAdm())$("#app").insertAdjacentHTML("beforeend",card());
};
})();
</script>

const tag=t=>t.method=="truemoney"?'<span class="chip ok">TrueMoney</span>':t.method=="angpao"?'<span class="chip ok">อั่งเปาอัตโนมัติ</span>':t.method=="gift"?'<span class="chip">แจกเครดิต</span>':"";
adTopUI=function(){
return `<div class="c"><h3>รายการแจ้งโอน</h3>${tops.slice(0,60).map(t=>`<div class="rw"><div style="min-width:0"><b>${esc(t.u)}</b> · ${t.amount} บาท ${tag(t)}<div class="mu">${fd(t.at)}</div>${/^https:\/\//.test(t.link||"")?`<a class="mu" style="word-break:break-all" href="${esc(t.link)}" target="_blank" rel="noopener">เปิดลิงก์ซองอั่งเปา</a>`:""}${t.note?`<div class="mu">${esc(t.note)}</div>`:""}</div><span class="ac">${t.img?`<button class="b s sm" onclick="showImg('${t.id}')">สลิป</button>`:""}${t.status=="pending"?`<button class="b sm" onclick="decide('${t.id}',1)">อนุมัติ</button><button class="b d sm" onclick="decide('${t.id}',0)">ปฏิเสธ</button>`:stChip(t.status)}</span></div>`).join("")||'<span class="mu">ไม่มี</span>'}</div>`;
};
})();
</script>

<!-- ===== บล็อกสุดท้าย: เมนูแอดมิน (หมวด > หน้า) + ตัวกันหน้าว่าง ===== -->
<style>
.dsc details{margin-top:6px}
.dsc summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 10px;font-size:14px;font-weight:600;color:var(--mntx,var(--tx));cursor:pointer;border-radius:12px;user-select:none}
.dsc summary::-webkit-details-marker{display:none}
.dsc summary .gi{display:flex;color:var(--ac)}
.dsc summary .gb{background:var(--er);color:#fff;font-size:11px;font-weight:600;padding:0 7px;border-radius:99px;line-height:18px}
.dsc summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s;opacity:.5}
.dsc details[open]>summary::after{transform:rotate(-135deg)}
.dsc details>.gl{margin:0 0 4px 21px;padding-left:8px;border-left:2px solid color-mix(in srgb,var(--tx) 12%,transparent)}
.dsc .gl .di{padding:10px;font-size:14.5px}
#cb{width:var(--cbs,58px);height:var(--cbs,58px)}
#cb svg{width:calc(var(--cbs,58px)*.45);height:calc(var(--cbs,58px)*.45)}
</style>
<script>
(()=>{
let inC=false;

/* 1) โครงเมนูแอดมิน: [ชื่อหมวด, [รายการ], ไอคอน] */
const _N=NAV;
NAV=function(){
const G=_N();
if(!isAdm())return G;
const m={};G.forEach(([g,L])=>L.forEach(i=>m[i[0]]=i));
const I=(k,l,ic)=>[k,l,ic,m[k]?m[k][3]:""];
const menu=()=>["เมนูและปุ่ม",[I("c_menu","เมนูลัดล่าง / สีแถบเมนู","menu"),I("c_chat","ปุ่มแชทลอย (รูป + ขนาด)","chat")],"menu"];
const ann=()=>["ประกาศและแจ้งเตือน",[I("a_info","ข้อความ / ติดต่อ / ป๊อปอัป","info"),I("c_ads","แถบประกาศ / รูป / วิดีโอ / โฆษณา","info"),I("c_notify","สีและขนาดแจ้งเตือน","bolt")],"info"];
const acc=()=>["บัญชี",[I("acct","บัญชี / โปรไฟล์ / รหัสผ่าน","user")],"user"];
const out=MAIN?[
["จัดการเว็บเช่า",[I("a_rent","คำสั่งเช่า","doc"),I("a_plan","แพ็กเกจเช่า","tag"),I("a_shops","ร้านที่เช่า","shop")],"shop"],
["การเงิน",[I("a_pay","บัญชีรับโอนค่าเช่า (ธนาคาร + TrueMoney)","card")],"card"],
["หน้าตาเว็บ",[I("a_brand","ชื่อ / โลโก้ / แบนเนอร์","star"),I("a_look","สี / ฟอนต์","pal"),I("c_bg","วิดีโอพื้นหลัง","wand"),I("a_anim","แอนิเมชัน / ลูกเล่น","wand")],"pal"],
menu(),ann(),acc()
]:[
["ภาพรวม",[I("a_dash","สรุปร้าน","chart")],"chart"],
["สินค้า",[I("a_prod","จัดการสินค้า / หมวดหมู่","box")],"box"],
["การเงิน",[I("a_top","รายการโอน (อนุมัติสลิป)","bolt"),I("a_pay","บัญชีรับเงิน (ธนาคาร + TrueMoney)","card"),I("a_keys","คีย์เติมเงิน","key"),I("a_gift","แจกเครดิตให้ผู้เล่น","bolt"),I("c_welcome","เครดิตต้อนรับสมาชิกใหม่","star")],"bolt"],
["หน้าตาร้าน",[I("a_brand","ชื่อ / โลโก้ / แบนเนอร์","star"),I("a_look","สี / ฟอนต์","pal"),I("a_card","การ์ดสินค้า","card"),I("c_bg","วิดีโอพื้นหลัง","wand"),I("a_anim","แอนิเมชัน / ลูกเล่น","wand")],"pal"],
menu(),ann(),
["หน้าร้าน",[I("shop","ดูหน้าร้านลูกค้า","shop")],"shop"],
acc()
];
if(inC)out.push(["",[["a_cust","","wand"]],"wand"]);
return out;
};

/* 2) เมนู 3 ขีด: หมวดพับ/ขยายได้ (ลูกค้าก็ใช้ตัวนี้ได้ เพราะไม่มีไอคอนหมวดจะใช้ไอคอน info) */
window.__mg=window.__mg||{};
menuOpen=function(){
try{
const G=NAV();
$("#mo").innerHTML=`<div class="ov dr" onclick="if(event.target==this)closeM()"><div class="dw"><div class="dh">${site.logo?`<img src="${esc(site.logo)}">`:""}<b>${esc(nm())}</b><button class="ib" onclick="closeM()">${ico("close")}</button></div>${me?`<div class="dme">${isAdm()?"ผู้ดูแล":esc(me.u)}${!isAdm()&&!MAIN?` · <span class="bal">${wal.credits||0} บาท</span>`:""}</div>`:""}<div class="dsc">${G.map(([g,L,ic],gi)=>{
const has=L.some(x=>x[0]==tab),op=window.__mg[gi]!==undefined?window.__mg[gi]:true,bd=L.reduce((s,x)=>s+(+x[3]||0),0);
return `<details ${op||has?"open":""} ontoggle="__mg[${gi}]=this.open"><summary><span class="gi">${ico(ic||"info")}</span>${g}${bd?`<span class="gb">${bd}</span>`:""}</summary><div class="gl">${L.map(([k,l,i2,b])=>`<button class="di ${tab==k?"on":""}" onclick="goT('${k}')"><span class="dic">${ico(i2)}</span><span>${l}</span>${b?`<span class="er ml">${b}</span>`:""}</button>`).join("")}</div></details>`}).join("")}</div><div class="dq"><button class="di" onclick="toggleTheme()"><span class="dic">${ico("moon")}</span><span>สลับโหมดมืด / สว่าง</span></button>${me?`<button class="di" onclick="logout()"><span class="dic">${ico("out")}</span><span>ออกจากระบบ</span></button>`:`<button class="di" onclick="authUI(0)"><span class="dic">${ico("login")}</span><span>เข้าสู่ระบบ / สมัครสมาชิก</span></button>`}</div></div></div>`;
}catch(e){showErr("เมนู: "+(e&&e.message||e))}
};

/* ปุ่ม "ปรับแต่ง" ที่แถบล่าง พาไปหน้า ชื่อ/โลโก้ */
const _g=goT;
goT=function(k){if(k=="a_cust"&&isAdm())k="a_brand";_g(k)};

/* 3) ธนาคาร + TrueMoney อยู่ฟอร์มเดียว ปุ่มบันทึกเดียว */
const _S=SCH;
SCH=function(){
const s=_S();
if(!s.pay.some(f=>f[1]=="twPay"))s.pay.push(["a","twPay","TrueMoney: เบอร์ / ชื่อ (ว่างทั้งสองช่อง = ปิดการรับ TrueMoney)"],["f","twQr","รูป QR TrueMoney",500]);
return s;
};
/* เว็บหลัก: ตอนลูกค้ากดเช่า โชว์ช่องทาง TrueMoney ด้วย */
if(MAIN){
const _rent=rent;
rent=function(id){
_rent(id);
const m=document.querySelector("#mo .md"),f=m&&m.querySelector("#rsl");
if(f&&(site.twPay||site.twQr)&&!m.querySelector(".tmx")){
const x=document.createElement("div");x.className="c tmx";x.style.marginTop="10px";
x.innerHTML=`<h3>หรือโอนผ่าน TrueMoney</h3>${site.twQr?`<img src="${esc(site.twQr)}" style="max-width:200px;border-radius:10px;display:block;margin-bottom:8px">`:""}<div class="mu" style="white-space:pre-wrap">${esc(site.twPay||"")}</div>`;
f.before(x);
}
};
}

/* 4) หน้าย่อยแยกจาก "ปรับแต่งทั้งหมด" */
const PG={
c_menu:{t:"เมนูลัดล่าง / สีแถบเมนู",k:["เมนูลัดด้านล่าง","สีแถบเมนู"]},
c_chat:{t:"ปุ่มแชทลอย",k:["ปุ่มแชทลอย (วงกลม)"]},
c_bg:{t:"วิดีโอพื้นหลัง",k:["วิดีโอพื้นหลัง"]},
c_ads:{t:"แถบประกาศ / รูป / วิดีโอ / โฆษณา",k:["ข้อความ + รูปประกาศ","วิดีโอป้ายประกาศหน้าหลัก","โฆษณา"]},
c_notify:{t:"สีและขนาดแจ้งเตือน",k:["สีการแจ้งเตือน","ขนาดการแจ้งเตือน"]},
c_welcome:{t:"เครดิตต้อนรับสมาชิกใหม่",k:["เครดิตต้อนรับสมาชิกใหม่"]}
};
const sizeCard=()=>{const v=+site.cbSize||58;return `<div class="c"><h3>ขนาดปุ่มแชทลอย</h3><div class="mu" style="margin-bottom:8px">ปรับได้ 40 - 120 px (ค่าเริ่มต้น 58)</div><label class="mu">ขนาด: <b id="cbv">${v}</b> px</label><input type="range" min="40" max="120" step="2" value="${v}" oninput="document.getElementById('cbv').textContent=this.value;document.documentElement.style.setProperty('--cbs',this.value+'px')" onchange="cuSet('cbSize',+this.value)"><button class="b s f" onclick="cuCbReset()">รีเซ็ตกลับ 58px</button></div>`};
window.cuCbReset=async()=>{try{await D("settings/site").update({cbSize:firebase.firestore.FieldValue.delete()});await load();render();say("รีเซ็ตขนาดปุ่มแชทแล้ว",1)}catch(e){say(ERR(e))}};
const applySize=()=>{const n=+site.cbSize,r=document.documentElement.style;n>=40&&n<=120?r.setProperty("--cbs",n+"px"):r.removeProperty("--cbs")};

/* 5) ตัวกันหน้าว่าง */
const blank=()=>{const a=$("#app");return !!a&&![...a.children].some(e=>e.tagName!="HEADER"&&!e.classList.contains("nb")&&e.id!="nbv")};
const fail=e=>{
console.error(e);
const a=$("#app");if(!a)return;
a.querySelectorAll(".erx").forEach(x=>x.remove());
a.insertAdjacentHTML("beforeend",`<div class="c erx in"><h3 class="er">หน้านี้โหลดไม่สำเร็จ</h3><div class="mu" style="word-break:break-all">${esc((e&&e.message)||String(e))}</div><button class="b f" onclick="tab='';render()">กลับหน้าแรก</button></div>`);
};

/* 6) วาดหน้า */
const _r=render;
render=function(){
let bad=null;
try{
const t=tab,p=PG[t];
if(isAdm()&&p&&!(t=="c_welcome"&&MAIN)){
inC=true;tab="a_cust";
try{_r()}finally{tab=t;inC=false}
const app=$("#app");
const hit=[...app.querySelectorAll(".c")].filter(c=>{const h=c.querySelector(":scope > h3");return h&&p.k.some(n=>h.textContent.trim().startsWith(n))});
const keep=hit.filter(c=>!hit.some(o=>o!==c&&o.contains(c)));
[...app.children].forEach(e=>{if(e.tagName!="HEADER"&&!e.classList.contains("nb")&&e.id!="nbv")e.remove()});
app.insertAdjacentHTML("beforeend",`<h3 class="ph">${p.t}</h3>`);
keep.forEach(c=>{c.classList.add("in");app.appendChild(c)});
if(t=="c_chat")app.insertAdjacentHTML("beforeend",sizeCard());
if(!keep.length&&t!="c_chat")app.insertAdjacentHTML("beforeend",'<div class="c mu">ไม่มีการตั้งค่าในหน้านี้</div>');
}else{
_r();
}
}catch(e){inC=false;bad=e}
if(bad)fail(bad);
else if(blank()&&!window.__rb){window.__rb=1;tab="";try{render()}finally{window.__rb=0}}
try{applySize()}catch(e){}
};

render();
})();
</script>

<!-- ===== ADDON 11: แจกเครดิต/เครดิตต้อนรับ เฉพาะเว็บหลัก + จ่ายค่าเช่าด้วยเครดิต ===== -->
<script>
(()=>{
const FV=()=>firebase.firestore.FieldValue;
const ov=on=>{if(on){if(!$("#ld")){const d=document.createElement("div");d.id="ld";d.innerHTML='<div class="spn"></div>';document.body.appendChild(d)}}else $("#ld")?.remove()};
const g=async q=>(await q.get().catch(()=>({docs:[]}))).docs.map(x=>({id:x.id,...x.data()}));

/* โหลดข้อมูล: เว็บหลักมีกระเป๋าเงิน / ร้านเช่าไม่มีเครดิตต้อนรับ */
const _l=load;
load=async function(){
await _l();
if(!MAIN){site.welcome=0;return}
try{
if(isAdm()){accts=await g(C("accounts"));wals=await g(C("wallets"))}
else if(me){const w=await D("wallets/"+me.u).get().catch(()=>({exists:false}));wal=w.exists?w.data():{credits:0,orders:[]}}
}catch(e){}
};

/* ติดตามยอดเงินสด (ใช้ได้ทุกเว็บ รวมเว็บหลัก) */
liveWallet=function(){
if(unW){unW();unW=null}prevC=null;
if(!me||isAdm())return;
try{unW=D("wallets/"+me.u).onSnapshot(s=>{const c=s.exists?(s.data().credits||0):0;if(prevC!==null&&c>prevC)topDone(c-prevC);prevC=c;wal.credits=c;document.querySelectorAll(".bal").forEach(e=>e.textContent=c+" บาท")},()=>{})}catch(e){}
};

/* สมัครสมาชิกที่เว็บหลัก: สร้างกระเป๋า + เครดิตต้อนรับ */
const _d=doAuth;
doAuth=async function(up){
const u=($("#au")?.value||"").trim();
await _d(up);
if(up&&MAIN&&me&&!isAdm()&&me.u===u){
try{
const r=D("wallets/"+u);
if(!(await r.get()).exists){
const w=+site.welcome||0;
prevC=w;await r.set({credits:w,orders:[]});wal.credits=w;
if(w>0){lastTp=0;topDone(w,site.welcomeMsg||"ยินดีต้อนรับสมาชิกใหม่")}
document.querySelectorAll(".bal").forEach(e=>e.textContent=w+" บาท");
}
}catch(e){}
}
};

/* เมนู: เว็บหลักเพิ่มเมนูแจกเครดิต / ร้านเช่าตัดออก */
const _N=NAV;
NAV=function(){
const G=_N();
if(!isAdm())return G;
if(!MAIN)return G.map(([n,L,i])=>[n,L.filter(x=>!["a_gift","c_welcome"].includes(x[0])),i]);
const f=G.find(x=>x[0]=="การเงิน");
if(f&&!f[1].some(x=>x[0]=="a_gift"))f[1].push(["a_gift","แจกเครดิต / เครดิตต้อนรับ","bolt",""]);
return G;
};

/* ร้านเช่า: ซ่อนช่องเงินต้อนรับในฟอร์มตั้งค่า */
const _S=SCH;
SCH=function(){const s=_S();if(!MAIN)s.info=s.info.filter(f=>f[1]!="welcome");return s};

/* หน้าแจกเครดิต (เว็บหลักเท่านั้น) */
let gQ="";
const list=()=>{const q=gQ.toLowerCase();return accts.filter(a=>!q||a.id.toLowerCase().includes(q)).slice(0,60).map(a=>{const w=wals.find(x=>x.id==a.id);return `<div class="rw"><span><b>${esc(a.id)}</b><div class="mu">${(w&&w.credits)||0} บาท${a.banned?" · ระงับ":""}</div></span><button class="b sm" data-u="${esc(a.id)}" onclick="mgOne(this.dataset.u)">แจกเครดิต</button></div>`}).join("")||'<span class="mu">ไม่พบสมาชิก</span>'};
window.mgList=()=>list();
window.mgQ=v=>{gQ=v;document.getElementById("mgl").innerHTML=list()};
const page=()=>`<div class="c"><h3>เครดิตต้อนรับสมาชิกใหม่</h3><div class="mu" style="margin-bottom:8px">สมัครเสร็จได้เครดิตทันที พร้อมหน้าจอเขียวแจ้งเตือน (ใส่ 0 = ไม่แจก)</div><label class="mu">จำนวนเครดิต (บาท)</label><input type="number" min="0" value="${+site.welcome||0}" onchange="cuSet('welcome',+this.value||0)"><label class="mu">หัวข้อที่แสดง</label><input value="${esc(site.welcomeMsg||"")}" placeholder="ยินดีต้อนรับสมาชิกใหม่" onchange="cuSet('welcomeMsg',this.value.trim())"></div><div class="c"><h3>แจกให้สมาชิกทุกคน</h3><div class="mu">สมาชิกทั้งหมด ${accts.length} คน</div><input id="mga" type="number" min="1" placeholder="จำนวนเครดิตต่อคน (บาท)"><button class="b f" onclick="mgAll()">แจกทุกคน</button></div><div class="c"><h3>แจกรายคน</h3><input placeholder="ค้นหาชื่อผู้ใช้" oninput="mgQ(this.value)"><div id="mgl">${list()}</div></div>`;
const give=async(us,amt)=>{for(let i=0;i<us.length;i+=400){const b=R.batch();us.slice(i,i+400).forEach(u=>b.set(D("wallets/"+u),{credits:FV().increment(amt)},{merge:true}));await b.commit()}};
const chk=a=>a>0&&a<=100000;
window.mgOne=u=>modal(`<h3 style="margin:0 0 6px">แจกเครดิตให้ ${esc(u)}</h3><input id="mgx" type="number" min="1" placeholder="จำนวน (บาท)"><button class="b f" data-u="${esc(u)}" onclick="mgGo(this.dataset.u)">ยืนยันแจก</button>`);
window.mgGo=async u=>{
const a=+$("#mgx").value;
if(!chk(a))return say("กรอกจำนวน 1 - 100,000 บาท");
if(busy)return;busy=true;ov(1);
try{await give([u],a);closeM();await load();render();say("แจก "+a+" บาท ให้ "+u+" แล้ว",1)}catch(e){say(ERR(e))}finally{busy=false;ov(0)}
};
window.mgAll=async()=>{
const a=+$("#mga").value,us=accts.filter(x=>!x.banned).map(x=>x.id);
if(!chk(a))return say("กรอกจำนวน 1 - 100,000 บาท");
if(!us.length)return say("ยังไม่มีสมาชิก");
if(!confirm("แจก "+a+" บาท ให้ "+us.length+" คน (รวม "+a*us.length+" บาท)?"))return;
if(busy)return;busy=true;ov(1);
try{await give(us,a);await load();render();say("แจกให้ "+us.length+" คนแล้ว",1)}catch(e){say(ERR(e))}finally{busy=false;ov(0)}
};

/* วาดหน้า + แสดงยอดเงินที่หัวเว็บหลัก */
const _r=render;
render=function(){
_r();
if(!MAIN)return;
if(tab=="a_gift"&&isAdm()){
[...$("#app").children].forEach(e=>{if(e.tagName!="HEADER"&&!e.classList.contains("nb")&&e.id!="nbv")e.remove()});
$("#app").insertAdjacentHTML("beforeend",`<h3 class="ph">แจกเครดิต</h3>`+page());
}
if(me&&!isAdm()){const h=document.querySelector("#app header>span.r");if(h&&!h.querySelector(".bal"))h.insertAdjacentHTML("afterbegin",`<span class="bal">${wal.credits||0} บาท</span>`)}
};

/* เว็บหลัก: ปุ่มจ่ายค่าเช่าด้วยเครดิต */
if(MAIN){
const _rent=rent;
rent=function(id){
_rent(id);
const m=document.querySelector("#mo .md"),p=plans.find(x=>x.id==id);
if(!m||!p||m.querySelector(".pcx"))return;
