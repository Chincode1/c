<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ร้านค้า</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#fafaf8;--tx:#161616;--mu:#7b7b76;--bd:#e6e6e1;--ac:#0f766e;--ok:#15803d;--er:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--tx:#f0f0ec;--mu:#8d8d88;--bd:#2a2a28}}
:root[data-theme="dark"]{--bg:#121212;--tx:#f0f0ec;--mu:#8d8d88;--bd:#2a2a28}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Noto Sans Thai",system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:0 18px 130px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 0;border-bottom:1px solid var(--bd);margin-bottom:22px}
.lg{font-weight:600;font-size:18px}.bal{font-weight:600;color:var(--ac)}
.mu{color:var(--mu);font-size:14px}.r{display:flex;justify-content:space-between;align-items:center;gap:10px}
.c{border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}.c h3{margin:0 0 6px;font-size:16px;font-weight:600}
input,textarea,select{width:100%;padding:12px 14px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit;outline:0}
input:focus,textarea:focus{border-color:var(--ac)}
.b{padding:12px 20px;border:1px solid var(--ac);border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:500;cursor:pointer}
.b.s{background:transparent;color:var(--tx);border-color:var(--bd)}.b.d{background:var(--er);border-color:var(--er)}.b.sm{padding:7px 13px;font-size:13px}.b:disabled{opacity:.45}.b.f{width:100%;margin-top:8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px}
.p{cursor:pointer}.p .im{aspect-ratio:1;background:var(--bd);border-radius:12px;overflow:hidden}.p img{width:100%;height:100%;object-fit:cover;display:block}
.p b{display:block;font-weight:500;margin-top:8px;line-height:1.35}
.pr{display:block;font-size:20px;font-weight:600;color:var(--tx)}.pr small{font-size:13px;font-weight:400;color:var(--mu)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}.rw:last-child{border:0}
.ac{display:flex;gap:6px;flex-wrap:wrap}
#nv{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--bd);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:20}
#nv button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:13px;padding:10px 0;cursor:pointer}#nv button.on{color:var(--ac);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--bg);border:1px solid var(--bd);border-radius:16px;max-width:400px;width:100%;max-height:90vh;overflow:auto;padding:20px;animation:pop .25s ease}
.md .big{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;margin-bottom:12px}
.msg{padding:12px;border-radius:10px;background:var(--bd);white-space:pre-wrap;word-break:break-word;margin:10px 0}
.atb{display:flex;gap:6px;margin-bottom:14px}.atb button{flex:1}
#tw{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:min(92vw,360px);z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.ts{background:var(--bg);border:1px solid var(--ok);color:var(--tx);padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);animation:pop .25s ease}.ts.er{border-color:var(--er)}
.chip{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--bd)}.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.er{color:var(--er);border-color:var(--er)}
#dn{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);cursor:pointer;animation:fin .3s}
#dn .ci{width:120px;height:120px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 40px color-mix(in srgb,var(--ok) 40%,transparent);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
#dn path{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s ease .4s forwards}
#dn h2{margin:14px 0 0;font-size:28px}#dn .am{font-size:38px;font-weight:600;color:var(--ok)}
#dn .msg{max-width:340px;width:100%;text-align:left}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}@keyframes fin{from{opacity:0}}@keyframes dr{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="tw"></div><div class="w"><div id="app" class="mu">กำลังโหลด...</div></div><div id="mo"></div>
<script>
/* ===== ตั้งค่า: ใส่ค่า Firebase ของคุณ ===== */
const CFG={apiKey:"AIzaSyASvuyhGLcblkYWRuHhXOuIi2Gj6zYtzJU",authDomain:"chingame-ae1ce.firebaseapp.com",projectId:"chingame-ae1ce",appId:"1:691058862335:web:4f4597ec07c7a7245bc4ca"};
const MAIN_HOST="deltastore.rexzy.xyz"; /* โดเมนเว็บหลัก (เว็บของคุณ) */

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rs=()=>Math.random().toString(36).substring(2,10);
const sha=async(p,s)=>Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p+s)))).map(x=>x.toString(16).padStart(2,"0")).join("");
const fd=t=>new Date(t).toLocaleString("th-TH");
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

/* รู้ว่าเป็นร้านไหนจากโดเมนย่อย หรือ ?shop=รหัส */
const SHOP=(()=>{
const q=new URLSearchParams(location.search).get("shop");
if(q&&/^[a-z0-9-]{2,30}$/.test(q))return q;
const h=location.hostname;
if(h.endsWith("."+MAIN_HOST)){const s=h.slice(0,-MAIN_HOST.length-1).split(".").pop();if(/^[a-z0-9-]{2,30}$/.test(s)&&s!=="www")return s}
return"main";
})();
const B=SHOP==="main"?"":"shops/"+SHOP+"/";
const OK=!!(window.firebase&&CFG.projectId);
if(OK)firebase.initializeApp(CFG);
const R=OK?firebase.firestore():null,D=p=>R.doc(B+p),C=c=>R.collection(B+c);

let TIER=0,plans=[],rentals=[],me=null,site={},products=[],wal={credits:0,orders:[]},tab="shop",asub="prod",shops=[],keys=[],busy=false;
try{me=JSON.parse(LS.get("sess_"+SHOP)||"null")}catch(e){}

function say(m,ok){const t=document.createElement("div");t.className="ts"+(ok?"":" er");t.textContent=m;$("#tw").appendChild(t);setTimeout(()=>t.remove(),3200)}
const ERR=e=>e&&(e.code=="permission-denied"?"ไม่มีสิทธิ์เขียนฐานข้อมูล (ตรวจ Firestore Rules)":e.message||e.code)||"ผิดพลาด";
const closeM=()=>$("#mo").innerHTML="";
function modal(h){$("#mo").innerHTML=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="md">${h}</div></div>`}
function done(title,amt,sub){
const o=document.createElement("div");o.id="dn";
o.innerHTML=`<div class="ci"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2>${esc(title)}</h2>${amt?`<div class="am">${esc(amt)}</div>`:""}${sub?`<div class="msg">${esc(sub)}</div>`:""}<div class="mu">แตะเพื่อปิด</div>`;
o.onclick=()=>o.remove();document.body.appendChild(o);
}
function pic(file,max){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.75))};i.onerror=()=>no(Error("เปิดรูปไม่ได้"));i.src=fr.result};fr.onerror=()=>no(Error("อ่านไฟล์ไม่ได้"));fr.readAsDataURL(file)})}

/* ===== โหลดข้อมูล ===== */
async function load(){
const s=await D("settings/site").get().catch(()=>({exists:false}));
site=s.exists?s.data():{};
if(site.ac&&/^#[0-9a-f]{6}$/i.test(site.ac))document.documentElement.style.setProperty("--ac",site.ac);
document.title=site.name||"ร้านค้า";applyTheme();
if(SHOP!=="main"){
const p=await C("products").get().catch(()=>({docs:[]}));
products=p.docs.map(x=>({id:x.id,...x.data()}));
if(me&&me.role!=="admin"){const w=await D("wallets/"+me.u).get().catch(()=>({exists:false}));wal=w.exists?w.data():{credits:0,orders:[]}}
}
if(SHOP==="main"){
const q=await C("plans").get().catch(()=>({docs:[]}));
plans=q.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.price-b.price);
if(me){const rq=me.role==="admin"?await C("rentals").get().catch(()=>({docs:[]})):await C("rentals").where("u","==",me.u).get().catch(()=>({docs:[]}));
rentals=rq.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>b.at-a.at)}
}
if(me&&me.role==="admin"){
if(SHOP==="main"){const q=await R.collection("shops_meta").get();shops=q.docs.map(x=>({id:x.id,...x.data()}))}
else{const q=await C("keys").get().catch(()=>({docs:[]}));keys=q.docs.map(x=>({id:x.id,...x.data()}))}
}
}
const add=(u,n)=>R.runTransaction(async t=>{
const r=D("wallets/"+u),s=await t.get(r),d=s.exists?s.data():{credits:0,orders:[]};
if((d.credits||0)+n<0)throw Error("ยอดเงินไม่พอ");
t.set(r,{...d,credits:(d.credits||0)+n});
});

/* ===== เข้าสู่ระบบ / สมัคร (ชื่อผู้ใช้ + รหัสผ่านเท่านั้น) ===== */
function authUI(up){
modal(`<div class="atb"><button class="b sm ${up?"s":""}" onclick="authUI(0)">เข้าสู่ระบบ</button><button class="b sm ${up?"":"s"}" onclick="authUI(1)">สมัครสมาชิก</button></div><input id="au" placeholder="ชื่อผู้ใช้" autocapitalize="none"><input id="ap" type="password" placeholder="รหัสผ่าน (อย่างน้อย 4 ตัว)"><button class="b f" onclick="doAuth(${up})">${up?"สมัครสมาชิก":"เข้าสู่ระบบ"}</button>`);
}
async function doAuth(up){
const u=$("#au").value.trim(),pw=$("#ap").value;
if(!/^[A-Za-z0-9_.-]{4,30}$/.test(u))return say("ชื่อผู้ใช้ 4-30 ตัว (A-Z a-z 0-9 _ . -)");
if(pw.length<4)return say("รหัสผ่านอย่างน้อย 4 ตัว");
/* ถ้าเข้าสู่ระบบด้วยชื่อ admin ให้ตรวจแบบผู้ดูแล */
if(!up&&u.toLowerCase()==="admin")return doAdm();
if(up&&u.toLowerCase()==="admin")return say("ชื่อนี้ใช้ไม่ได้");
try{
const r=D("accounts/"+u),s=await r.get();let role="user";
if(up){
if(s.exists)return say("ชื่อนี้ถูกใช้แล้ว");
const salt=rs();
await r.set({hash:await sha(pw,salt),salt,role:"user",at:Date.now()});
await D("wallets/"+u).set({credits:+site.welcome||0,orders:[]});
}else{
if(!s.exists)return say("ไม่พบชื่อผู้ใช้");
const d=s.data();
if(d.hash!==await sha(pw,d.salt))return say("รหัสผ่านไม่ถูกต้อง");
if(d.banned)return say("บัญชีนี้ถูกระงับ");
}
me={u,role};LS.set("sess_"+SHOP,JSON.stringify(me));closeM();
await load();render();say(up?"สมัครสำเร็จ":"เข้าสู่ระบบสำเร็จ",1);
}catch(e){say(ERR(e))}
}
function admLogin(){
modal(`<h3 style="margin:0 0 6px">เข้าสู่ระบบผู้ดูแล</h3><div class="mu">แยกจากบัญชีลูกค้า</div><input id="au" placeholder="ชื่อผู้ดูแล" value="admin" autocapitalize="none"><input id="ap" type="password" placeholder="รหัสผ่านผู้ดูแล"><button class="b f" onclick="doAdm()">เข้าสู่ระบบ</button>`);
}
async function doAdm(){
const u=$("#au").value.trim(),pw=$("#ap").value;
if(!/^[A-Za-z0-9_.-]{3,30}$/.test(u)||!pw)return say("กรอกข้อมูลให้ครบ");
try{
const s=await D("admins/"+u).get();
if(!s.exists)return say("ไม่พบผู้ดูแลชื่อนี้");
const d=s.data();
if(d.hash!==await sha(pw,d.salt))return say("รหัสผ่านไม่ถูกต้อง");
me={u,role:"admin"};LS.set("sess_"+SHOP,JSON.stringify(me));closeM();tab="adm";
await load();render();say("เข้าสู่ระบบผู้ดูแลสำเร็จ",1);
}catch(e){say(ERR(e))}
}
function logout(){me=null;wal={credits:0,orders:[]};LS.set("sess_"+SHOP,"");tab="shop";render()}

/* ===== หน้าหลัก ===== */
function render(){
const T=[];
if(SHOP!=="main"){T.push(["shop","สินค้า"]);if(me&&me.role!=="admin")T.push(["top","เติมเงิน"],["his","ประวัติ"])}
if(SHOP==="main"){T.push(["plans","แพ็กเกจเช่า"]);if(me&&me.role!=="admin")T.push(["mine","การเช่าของฉัน"])}
if(me&&me.role==="admin")T.push(["adm","แอดมิน"]);
if(!T.some(t=>t[0]===tab))tab=T.length?T[0][0]:"home";
let h=`<header><span class="lg">${TIER>=1&&site.logo?`<img src="${esc(site.logo)}" style="height:26px;vertical-align:middle;margin-right:8px">`:""}${esc(site.name||(SHOP==="main"?"เช่าเว็บร้านค้า":"ร้านค้า"))}</span><span class="r" style="gap:12px">${me&&me.role!=="admin"&&SHOP!=="main"?`<span class="bal">${wal.credits||0} บาท</span>`:""}${me?`<button class="b s sm" onclick="logout()">ออก</button>`:`<button class="b sm" onclick="authUI(0)">เข้าสู่ระบบ</button>`}</span></header>`;
if(TIER>=1&&site.notice)h+=`<div class="c mu" style="text-align:center">${esc(site.notice)}</div>`;
if(tab==="home")h+=`<div class="c"><h3>เช่าเว็บร้านค้าสำเร็จรูป</h3><div class="mu" style="white-space:pre-wrap">${esc(site.contact||"ติดต่อผู้ให้บริการเพื่อเปิดร้านของคุณ")}</div></div>`;
if(tab==="shop")h+=shopUI();
if(tab==="top")h+=topUI();
if(tab==="his")h+=hisUI();
if(tab==="plans")h+=plansUI();
if(tab==="mine")h+=mineUI();
if(tab==="adm")h+=SHOP==="main"?platUI():adminUI();
$("#app").innerHTML=h+(me?"":'<div style="text-align:center;margin-top:30px"><a class="mu" href="#" onclick="admLogin();return false">สำหรับผู้ดูแล</a></div>');
let n=$("#nv");
if(T.length>1){if(!n){n=document.createElement("div");n.id="nv";document.body.appendChild(n)}n.innerHTML=T.map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="goT('${k}')">${l}</button>`).join("")}else if(n)n.remove();
}
function goT(k){tab=k;render();scrollTo(0,0)}

/* ===== ร้านค้า ===== */
const pr=p=>`<span class="pr">${p.price} <small>บาท</small></span>`;
const oos=p=>p.stock!=null&&p.stock!==""&&+p.stock<=0;
function shopUI(){
const L=products.filter(p=>!p.hide),bn=TIER>=2&&site.banner?`<img src="${esc(site.banner)}" style="width:100%;border-radius:14px;margin-bottom:16px;display:block">`:"";
return bn+(L.length?`<div class="g">${L.map(p=>`<div class="p" onclick="detail('${p.id}')"><div class="im">${p.img?`<img src="${esc(p.img)}" loading="lazy">`:""}</div><b>${esc(p.name)}</b>${pr(p)}${oos(p)?'<span class="mu">สินค้าหมด</span>':""}</div>`).join("")}</div>`:'<div class="c mu">ยังไม่มีสินค้า</div>');
}
function detail(id){
if(!me){authUI(0);return say("เข้าสู่ระบบก่อนสั่งซื้อ")}
if(me.role==="admin")return say("ผู้ดูแลสั่งซื้อไม่ได้ ใช้บัญชีลูกค้าแทน");
const p=products.find(x=>x.id==id);if(!p)return;
modal(`${p.img?`<img class="big" src="${esc(p.img)}">`:""}<h3 style="margin:0">${esc(p.name)}</h3><p class="mu" style="white-space:pre-wrap">${esc(p.desc||"")}</p>${p.stock!=null&&p.stock!==""&&!oos(p)?`<p class="mu">คงเหลือ ${p.stock} ชิ้น</p>`:""}<div class="r"><span style="font-size:26px;font-weight:600">${p.price} <small class="mu">บาท</small></span>${oos(p)?'<button class="b" disabled>สินค้าหมด</button>':`<button class="b" id="bb" onclick="buy('${p.id}')">สั่งซื้อ</button>`}</div>`);
}
async function buy(id){
if(busy)return;busy=true;const b=$("#bb");if(b)b.disabled=true;
try{
let msg="";
await R.runTransaction(async t=>{
const pr_=D("products/"+id),wr=D("wallets/"+me.u);
const [ps,ws]=await Promise.all([t.get(pr_),t.get(wr)]);
if(!ps.exists)throw Error("ไม่พบสินค้า");
const p=ps.data(),d=ws.exists?ws.data():{credits:0,orders:[]};
if(p.stock!=null&&p.stock!==""&&+p.stock<=0)throw Error("สินค้าหมด");
if((d.credits||0)<p.price)throw Error("ยอดเงินไม่พอ กรุณาเติมเงิน");
t.set(wr,{...d,credits:d.credits-p.price,orders:[...(d.orders||[]),{name:p.name,price:p.price,at:Date.now()}]});
if(p.stock!=null&&p.stock!=="")t.update(pr_,{stock:+p.stock-1});
msg=p.message||"ขอบคุณที่ใช้บริการ";
});
closeM();await load();render();done("สั่งซื้อสำเร็จ","",msg);
}catch(e){if(b)b.disabled=false;say(ERR(e))}
finally{busy=false}
}
const hisUI=()=>`<div class="c"><h3>ประวัติสั่งซื้อ</h3>${(wal.orders||[]).slice().reverse().map(o=>`<div class="rw"><div><b>${esc(o.name)}</b><div class="mu">${fd(o.at)}</div></div><b>${o.price} บาท</b></div>`).join("")||'<span class="mu">ยังไม่มี</span>'}</div>`;

/* ===== เติมเงิน: ตรวจสลิปอัตโนมัติ + ใส่คีย์ ===== */
function topUI(){
return `<div class="c"><h3>เติมเงินด้วยสลิป</h3>${site.slipApi?`${site.qr?`<img src="${esc(site.qr)}" style="max-width:200px;border-radius:10px;display:block;margin-bottom:10px">`:""}<div class="mu" style="white-space:pre-wrap">${esc(site.pay||"")}</div><input id="ta" type="number" min="1" placeholder="จำนวนเงินที่โอน (บาท)"><input id="ts" type="file" accept="image/*"><button class="b f" id="tb" onclick="sendSlip()">ตรวจสลิปและเติมเงิน</button>`:'<div class="mu">ร้านนี้ยังไม่เปิดเติมเงินด้วยสลิป</div>'}</div><div class="c"><h3>ใส่คีย์เติมเงิน</h3><input id="k" placeholder="XXXX-XXXX-XXXX" autocapitalize="characters"><button class="b f" onclick="redeem()">ยืนยัน</button></div>`;
}
async function sendSlip(){
const a=+($("#ta").value||0),f=$("#ts").files[0];
if(!(a>0))return say("กรอกจำนวนเงิน");
if(!f)return say("แนบสลิป");
if(busy)return;busy=true;const b=$("#tb");b.disabled=true;b.textContent="กำลังตรวจสลิป...";
try{
const fm=new FormData();fm.append("file",f);fm.append("amount",a);
const d=await(await fetch(site.slipApi,{method:"POST",body:fm})).json().catch(()=>({}));
if(!d.ok)throw Error(d.message||"ตรวจสลิปไม่ผ่าน");
const ref=String(d.transRef||"").replace(/[^A-Za-z0-9]/g,"");
if(!ref)throw Error("อ่านรหัสอ้างอิงสลิปไม่ได้");
await R.runTransaction(async t=>{
const sr=D("slips/"+ref),wr=D("wallets/"+me.u);
const [s,w]=await Promise.all([t.get(sr),t.get(wr)]);
if(s.exists)throw Error("สลิปนี้ถูกใช้แล้ว");
const x=w.exists?w.data():{credits:0,orders:[]};
t.set(sr,{u:me.u,amount:a,at:Date.now()});
t.set(wr,{...x,credits:(x.credits||0)+a});
});
await load();render();done("เติมเงินสำเร็จ","+"+a+" บาท");
}catch(e){b.disabled=false;b.textContent="ตรวจสลิปและเติมเงิน";say(ERR(e))}
finally{busy=false}
}
async function redeem(){
const c=$("#k").value.trim().toUpperCase();if(!c)return say("กรอกคีย์");
if(busy)return;busy=true;
try{
let val=0;
await R.runTransaction(async t=>{
const kr=D("keys/"+c),wr=D("wallets/"+me.u);
const [k,w]=await Promise.all([t.get(kr),t.get(wr)]);
if(!k.exists||k.data().used)throw Error("คีย์ไม่ถูกต้องหรือถูกใช้แล้ว");
val=k.data().credits;
const x=w.exists?w.data():{credits:0,orders:[]};
t.update(kr,{used:true,usedBy:me.u,usedAt:Date.now()});
t.set(wr,{...x,credits:(x.credits||0)+val});
});
await load();render();done("เติมเงินสำเร็จ","+"+val+" บาท");
}catch(e){say(ERR(e))}
finally{busy=false}
}

async function mkShop(id,name,pw,days,tier){
const salt=rs();
await R.doc("shops/"+id+"/admins/admin").set({hash:await sha(pw,salt),salt});
await R.doc("shops/"+id+"/settings/site").set({name});
await R.doc("shops_meta/"+id).set({name,tier,exp:Date.now()+days*864e5,at:Date.now(),off:false});
}
async function makeShop(rid){
const id=$("#ni").value.trim().toLowerCase(),name=$("#nn").value.trim()||id,pw=$("#np").value;
const r=rentals.find(x=>x.id==rid);
if(!r||r.status!=="approved")return say("รายการนี้ยังไม่อนุมัติ");
if(!/^[a-z0-9-]{2,30}$/.test(id)||["main","www","admin"].includes(id))return say("ชื่อลิงก์ไม่ถูกต้อง");
if(pw.length<6)return say("รหัสผ่านอย่างน้อย 6 ตัว");
if(busy)return;busy=true;
try{
if((await R.doc("shops_meta/"+id).get()).exists)return say("ชื่อลิงก์นี้ถูกใช้แล้ว");
await mkShop(id,name,pw,r.days,r.tier);
await D("rentals/"+rid).update({status:"done",shop:id});
closeM();await load();render();say("เปิดร้านสำเร็จ",1);
}catch(e){say(ERR(e))}
finally{busy=false}
}

const shopLink=id=>location.origin+location.pathname+"?shop="+id;
function platUI(){
return rentAdmin()+planAdmin()+`<div class="c"><h3>สร้างร้านให้ลูกค้าเช่า</h3><input id="ni" placeholder="รหัสร้าน (a-z 0-9 -) เช่น shop1" autocapitalize="none"><input id="nn" placeholder="ชื่อร้าน"><input id="np" placeholder="รหัสผ่านแอดมินของร้าน"><input id="nd" type="number" value="30" placeholder="จำนวนวันที่เช่า"><select id="nt"><option value="basic">ธรรมดา</option><option value="v1">พรีเมียม V1</option><option value="v2">พรีเมียม V2</option></select><button class="b f" onclick="newShop()">สร้างร้าน</button></div><div class="c"><h3>ร้านที่เช่า (${shops.length})</h3>${shops.map(s=>{const ex=s.exp&&s.exp<Date.now();return `<div class="rw" style="flex-wrap:wrap"><div style="min-width:0"><b>${esc(s.name||s.id)}</b> <span class="chip ${s.off||ex?"er":"ok"}">${s.off?"ระงับ":ex?"หมดอายุ":"ใช้งาน"}</span><div class="mu">หมดอายุ ${s.exp?fd(s.exp):"-"}</div><div class="mu" style="word-break:break-all;user-select:all">${esc(shopLink(s.id))}</div></div><span class="ac"><button class="b s sm" onclick="renew('${s.id}')">ต่อ 30 วัน</button><button class="b s sm" onclick="toggleShop('${s.id}',${!s.off})">${s.off?"เปิด":"ระงับ"}</button></span></div>`}).join("")||'<span class="mu">ยังไม่มีร้าน</span>'}</div><div class="c"><h3>ข้อความหน้าแรกเว็บหลัก</h3><textarea id="ct" placeholder="ราคาเช่า ช่องทางติดต่อ">${esc(site.contact||"")}</textarea><input id="mn" placeholder="ชื่อเว็บหลัก" value="${esc(site.name||"")}"><button class="b f" onclick="saveMain()">บันทึก</button></div>`;
}
async function newShop(){
const id=$("#ni").value.trim().toLowerCase(),pw=$("#np").value,days=+$("#nd").value||30;
if(!/^[a-z0-9-]{2,30}$/.test(id)||id==="main"||id==="www")return say("รหัสร้านไม่ถูกต้อง");
if(pw.length<4)return say("รหัสผ่านอย่างน้อย 4 ตัว");
try{
if((await R.doc("shops_meta/"+id).get()).exists)return say("รหัสร้านนี้ถูกใช้แล้ว");
await mkShop(id,$("#nn").value.trim()||id,pw,days,$("#nt").value);
await load();render();say("สร้างร้านแล้ว",1);
}catch(e){say(ERR(e))}
}
async function renew(id){
try{const s=shops.find(x=>x.id==id),base=Math.max(Date.now(),s.exp||0);await R.doc("shops_meta/"+id).update({exp:base+30*864e5});await load();render();say("ต่ออายุแล้ว",1)}catch(e){say(ERR(e))}
}
async function toggleShop(id,off){try{await R.doc("shops_meta/"+id).update({off});await load();render()}catch(e){say(ERR(e))}}
async function saveMain(){
try{await D("settings/site").set({...site,contact:$("#ct").value.trim(),name:$("#mn").value.trim()});await load();render();say("บันทึกแล้ว",1)}catch(e){say(ERR(e))}
}

/* ===== ตั้งรหัสแอดมินครั้งแรก (เว็บหลัก) ===== */
function setupUI(){
modal(`<h3 style="margin:0 0 6px">ตั้งรหัสผู้ดูแล</h3><div class="mu">ครั้งแรกที่เปิดเว็บ ตั้งรหัสผ่านผู้ดูแล (แยกจากบัญชีลูกค้า)</div><input id="sp1" type="password" placeholder="รหัสผ่าน (อย่างน้อย 8 ตัว)"><button class="b f" onclick="doSetup()">ตั้งรหัส</button>`);
}
async function doSetup(){
const p=$("#sp1").value;if(p.length<8)return say("อย่างน้อย 8 ตัว");
try{const salt=rs();await R.doc("admins/admin").set({hash:await sha(p,salt),salt});closeM();say("ตั้งรหัสแล้ว เข้าสู่ระบบผู้ดูแลได้เลย",1);admLogin()}catch(e){say(ERR(e))}
}

/* ===== เริ่มทำงาน ===== */
(async()=>{
if(!OK){$("#app").innerHTML='<div class="c"><h3>ยังเชื่อมฐานข้อมูลไม่ได้</h3><div class="mu">'+(CFG.projectId?"โหลด Firebase ไม่สำเร็จ ตรวจอินเทอร์เน็ตหรือเปิดไฟล์นี้จากเว็บโฮสต์ของคุณ":"ยังไม่ได้ใส่ค่า CFG ของ Firebase ในไฟล์ (ต้นสคริปต์)")+'</div></div>';return}
try{
if(SHOP!=="main"){
const m=await R.doc("shops_meta/"+SHOP).get();
TIER=m.exists?({basic:0,v1:1,v2:2})[m.data().tier]||0:0;
if(!m.exists||m.data().off||(m.data().exp&&m.data().exp<Date.now())){
$("#app").innerHTML='<div class="c" style="text-align:center;margin-top:60px"><h3>ร้านนี้ยังไม่เปิดใช้งานหรือหมดอายุ</h3><div class="mu">กรุณาติดต่อผู้ให้บริการ</div></div>';return;
}
}
if(me){if(me.role==="admin"){if(!(await D("admins/"+me.u).get()).exists)me=null}else{const a=await D("accounts/"+me.u).get();if(!a.exists||a.data().banned)me=null;else me.role="user"}}
await load();render();
if(SHOP==="main"&&!(await R.doc("admins/admin").get()).exists)setupUI();
if(!me&&location.hash==="#admin")admLogin();
}catch(e){$("#app").innerHTML='<div class="c" style="color:var(--er)">โหลดไม่สำเร็จ: '+esc(ERR(e))+'<div class="mu">ตรวจค่า CFG ของ Firebase และ Firestore Rules</div></div>'}
})();
</script></body></html>
